name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build (locked)
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

  cli-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p ontixa-cli --locked

      - name: run hello.ixa
        run: test "$(./target/debug/ontixa run examples/hello.ixa)" = "42"

      - name: run structs.ixa
        run: test "$(./target/debug/ontixa run examples/structs.ixa)" = "25"

      - name: run borrow-inference.ixa
        run: test "$(./target/debug/ontixa run examples/borrow-inference.ixa)" = "14"

      - name: move-error.ixa is rejected
        run: |
          if ./target/debug/ontixa check examples/move-error.ixa; then
            echo "expected failure"; exit 1
          fi

      - name: move-error.ixa reports E_USE_AFTER_MOVE
        run: |
          ./target/debug/ontixa check examples/move-error.ixa --json \
            | grep -q '"E_USE_AFTER_MOVE"'

      - name: graph exposes inferred behaviors
        run: |
          g=$(./target/debug/ontixa graph examples/borrow-inference.ixa)
          for b in borrow borrow_mut move escape copy; do
            echo "$g" | grep -q "\"$b\"" || { echo "missing $b"; exit 1; }
          done

      - name: graph exposes passes edges
        run: |
          ./target/debug/ontixa graph examples/borrow-inference.ixa \
            | grep -q '"passes"'

      - name: artifacts are byte-deterministic
        run: |
          a=$(./target/debug/ontixa graph examples/borrow-inference.ixa --json)
          b=$(./target/debug/ontixa graph examples/borrow-inference.ixa --json)
          test "$a" = "$b" || { echo "graph --json not byte-stable"; exit 1; }
          a=$(./target/debug/ontixa mir examples/borrow-inference.ixa --json)
          b=$(./target/debug/ontixa mir examples/borrow-inference.ixa --json)
          test "$a" = "$b" || { echo "mir --json not byte-stable"; exit 1; }
